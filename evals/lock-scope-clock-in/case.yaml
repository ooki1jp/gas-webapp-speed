schema_version: "1.1"
name: lock-scope-clock-in
expected_outcome: |
  punch.gs saves the photo to Drive and sends the notification outside the lock, holds
  the lock only for invalidating any cached snapshot, re-reading the punches sheet, the
  dedupe check, the single appendRow and a flush. The retry id (rid) is stored in the
  punches row and checked inside that same lock; CacheService, if used at all, is only a
  hint written after the row. The notification is made durable before the lock is
  released (e.g. a pending flag in the row, or an outbox row written in the same section)
  rather than queued afterwards. The response still returns today's punches — built from
  the rows already read inside the lock, not from a second read or a full month rebuild.
  notes.md explains why each slow step is outside the lock and why marking "seen" before
  writing (or only in CacheService) produces false "ok" responses.
