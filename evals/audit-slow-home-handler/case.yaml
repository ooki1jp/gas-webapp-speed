schema_version: "1.1"
name: audit-slow-home-handler
expected_outcome: |
  analysis.md states that home_ reaches readRows_ 6 times for a one-company user
  (companiesOf_ twice × 1 read, listPayslips_ 2, docsList_ 2) over 3 distinct sheets
  (payslips, views, docs), attributes the cost to repeated
  reads of the same sheets rather than to data volume or cold start, recommends a
  request-scope memo then a Sheets batchGet, and gives the after number as 1 round trip
  (one batchGet) for the sheet reads, or 3 with a request-scope memo alone. It does not recommend moving to a database.
context:
  scaffold_script: place-files.sh
